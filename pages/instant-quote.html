<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Get an Instant Quote | A Team Property Improvement</title><link rel="stylesheet" href="/css/main.css"></head><body><div data-include="/pages/partials/nav.html"></div><main class="content-section"><div class="section-inner"><p class="eyebrow">Free estimate</p><h1>Get an instant quote</h1><p>Choose a service, enter measurements, then request a walkthrough to verify the quote.</p><form id="quote"><label>Service<select name="service"><option value="wood">Wood fence</option><option value="chain">Chain-link fence</option><option value="interior">Interior painting</option><option value="exterior">Exterior painting</option></select></label><label>Linear feet / wall square feet<input name="size" type="number" min="1" required></label><label>Additional measurement (height, ceiling area, or gates)<input name="extra" type="number" min="0" value="0"></label><button class="btn btn-primary">See estimate</button></form><section id="result" hidden><h2>Your starting estimate: <span></span></h2><p>This is a planning estimate; site conditions and scope can change the final price.</p><form action="https://api.web3forms.com/submit" method="post" class="contact-form"><input type="hidden" name="access_key" value="39bc33a4-e716-468a-aa49-31c3743adbe2"><input type="hidden" name="subject" value="A Team Lead | Instant Quote Verification"><input type="hidden" name="form_id" value="instant_quote_verification"><input type="hidden" name="lead_source" value="website_form"><input type="hidden" name="quote_details" id="details"><label>Name<input name="first_name" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" required></label><label>Project address<input name="project_address" required></label><button class="btn btn-primary">Verify my quote and request work</button></form></section></div></main><div data-include="/pages/partials/footer.html"></div><script src="/js/loader.js"></script><script>const f=document.querySelector('#quote'),r=document.querySelector('#result');f.onsubmit=e=>{e.preventDefault();const s=f.service.value,a=+f.size.value,b=+f.extra.value;const base={wood:a*42+b*250,chain:a*14+b*180,interior:a*2.9+b*1.1,exterior:a*3.4+b*2.2}[s];const total=base*1.15;r.hidden=false;r.querySelector('span').textContent=total.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});details.value=`${s} instant quote: size=${a}, extra=${b}, estimate=${total}`;r.scrollIntoView({behavior:'smooth'})}</script></body></html>
